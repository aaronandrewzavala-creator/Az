<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BendLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --plate:#E6E9EB; --panel:#F4F5F6; --ink:#1B2127; --muted:#56616B; --line:#C3C9CE;
  --brass:#9A5F22; --zone-gray:rgba(98,110,122,.26); --zone-gray-edge:#7C8791;
  --laser:#1461DB; --laser-soft:rgba(20,97,219,.22); --warn:#B8381F; --ok:#2E7447;
  --trace:#1B2127; --trace-dim:rgba(27,33,39,.35);
  --font:"Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --plate:#121518; --panel:#1B1F23; --ink:#E4E8EB; --muted:#98A3AD; --line:#343B42;
  --brass:#D59A55; --zone-gray:rgba(170,180,190,.2); --zone-gray-edge:#8D98A2;
  --laser:#4C8DFF; --laser-soft:rgba(76,141,255,.28); --warn:#F07457; --ok:#62C08A;
  --trace:#E4E8EB; --trace-dim:rgba(228,232,235,.35);
}}
:root[data-theme="dark"]{
  --plate:#121518; --panel:#1B1F23; --ink:#E4E8EB; --muted:#98A3AD; --line:#343B42;
  --brass:#D59A55; --zone-gray:rgba(170,180,190,.2); --zone-gray-edge:#8D98A2;
  --laser:#4C8DFF; --laser-soft:rgba(76,141,255,.28); --warn:#F07457; --ok:#62C08A;
  --trace:#E4E8EB; --trace-dim:rgba(228,232,235,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--plate);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--laser);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
header.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:125%;font-size:22px;letter-spacing:-.01em;margin:0 auto 0 0}
.brand span{font-weight:400;font-stretch:100%;color:var(--muted);font-size:13px;margin-left:6px}
.keysel{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--ink);color:var(--plate);border-color:var(--ink)}
.btn.live{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.lvl{width:44px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--ok)}

/* stage: the bend meter */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.target-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tgt{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.tgt .tab{font-weight:800;font-stretch:112%;font-size:26px}
.tgt .nm{font-weight:700;font-size:20px}
.tgt .hz{color:var(--muted);font-size:14px}
.tgt-desc{color:var(--muted);font-size:13px;margin:2px 0 8px}
#meter{display:block;width:100%;height:270px;touch-action:pan-y}
#zone{display:block;width:100%;height:54px;margin-top:6px}
.readouts{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px 12px;margin-top:10px;align-items:end}
.big{font-weight:800;font-stretch:88%;font-size:52px;line-height:1;letter-spacing:-.02em}
.big.sharp{color:var(--warn)} .big.gray{color:var(--ink)} .big.blue{color:var(--laser)} .big.idle{color:var(--line)}
.ro small{display:block;color:var(--muted);font-size:12px}
.ro b{font-size:17px;font-weight:700}
.laser{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--laser);color:#fff;font-weight:800;font-stretch:120%;font-size:18px;letter-spacing:.02em;visibility:hidden}
.laser.on{visibility:visible}
.coach{font-size:19px;font-weight:600;min-height:2.9em;margin:10px 0 0}
.notice{margin-top:8px;padding:10px;border-radius:6px;border:1px solid var(--warn);color:var(--ink);font-size:14px;display:none}
.notice.on{display:block}
.holdbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px;position:relative}
.holdbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--zone-gray-edge)}
.holdbar i.blue{background:var(--laser)}
.holdlbl{font-size:12px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}

/* tabs */
nav.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px;position:sticky;top:0;background:var(--plate);z-index:2;padding-top:env(safe-area-inset-top,0px)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.view{display:none}.view.on{display:block}
h2{font-size:18px;font-stretch:112%;margin:16px 0 6px}
p.lead{color:var(--muted);margin:0 0 10px;font-size:14px;max-width:62ch}

/* harmonica map */
.harp-scroll{overflow-x:auto;padding-bottom:4px}
.harp{display:grid;grid-template-columns:repeat(10,minmax(34px,1fr));gap:3px;min-width:350px}
.col{display:grid;grid-template-rows:repeat(2,30px) 34px 28px 34px repeat(3,30px);gap:3px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:5px;font-size:13px;font-weight:700;padding:0;min-height:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.chip.bend{border-style:dashed;font-weight:600;color:var(--muted);background:transparent}
.chip.sel{background:var(--brass);border-color:var(--brass);color:#fff;border-style:solid}
.chip.lad{border-color:var(--brass)}
.holeno{display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--plate);border-radius:3px;font-weight:800;font-size:13px}
.rowlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:4px 0}
.tone-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
.tone-row input[type=range]{width:120px}

/* last attempt */
.summary{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:14px}
.summary dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 14px;margin:6px 0 0}
.summary dt{color:var(--muted);font-size:12px}.summary dd{margin:0;font-weight:700}
.summary .verdict{font-weight:700}

/* learn */
.levels{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.levels button{width:100%;text-align:left;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px}
.levels .num{font-weight:800;font-stretch:120%;font-size:20px;color:var(--brass)}
.levels .t{font-weight:700}.levels .g{display:block;color:var(--muted);font-size:13px;font-weight:400}
.levels .done{font-size:13px;color:var(--ok);font-weight:700}
.lesson{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px}
.lesson h3{margin:0 0 4px;font-size:18px;font-stretch:112%}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.steps span{min-width:34px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;font-size:13px;text-align:center}
.steps span.cur{border-color:var(--brass);font-weight:700}
.steps span.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.reps{font-size:15px;font-weight:600;margin:6px 0}
.flash{font-weight:800;font-size:18px;min-height:1.5em}
.flash.good{color:var(--ok)} .flash.bad{color:var(--warn)}
details{margin-top:10px;font-size:14px} summary{cursor:pointer;font-weight:600}
details ul{margin:6px 0;padding-left:18px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* progress */
.tbl-scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;min-width:680px;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-size:14px}

/* settings */
.set{display:grid;gap:12px;max-width:520px}
.set label{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:15px}
.set label small{grid-column:1/-1;color:var(--muted);font-size:12px}
.set input[type=number]{width:84px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.sync{font-size:12px;color:var(--muted);margin-top:14px}
@media (max-width:420px){ .brand span{display:none}  .big{font-size:44px} .coach{font-size:17px} .readouts{grid-template-columns:1.2fr 1fr 1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1 class="brand">BendLab <span>harmonica bend trainer</span></h1>
  <label class="keysel">Key <select id="keySel" aria-label="Harmonica key"></select></label>
  <div class="lvl" title="Microphone input level" aria-hidden="true"><i id="lvl"></i></div>
  <button id="micBtn" class="btn primary">Start microphone</button>
</header>

<section class="stage" aria-label="Bend meter">
  <div class="target-row">
    <div class="tgt"><span class="tab" id="tTab">−3″</span><span class="nm" id="tName">A4</span><span class="hz" id="tHz">440.00 Hz</span></div>
    <button class="btn" id="hearBtn">Hear target</button>
    <button class="btn" id="stopBtn">Stop</button>
  </div>
  <div class="tgt-desc" id="tDesc"></div>
  <canvas id="meter" aria-label="Pitch path from the natural note to the deepest bend on this hole"></canvas>
  <canvas id="zone" aria-label="Distance from target in cents"></canvas>
  <div class="laser" id="laser">LASER ACCURATE 0¢</div>
  <div class="readouts">
    <div class="ro"><small>Off target</small><div class="big idle" id="cents">—</div></div>
    <div class="ro"><small>Detected</small><b id="dNote">—</b><small id="dHz">— Hz</small></div>
    <div class="ro"><small>Stability</small><b id="stab">—</b><small id="phase">Waiting</small></div>
  </div>
  <div class="holdbar" aria-hidden="true"><i id="holdFill"></i></div>
  <div class="holdlbl"><span id="holdTxt">Hold 0.0 s</span><span id="holdGoal"></span></div>
  <p class="coach" id="coach" aria-live="polite"></p>
  <div class="notice" id="micNotice" role="alert"></div>
  <div class="summary" id="summary" hidden></div>
</section>

<nav class="tabs" role="tablist">
  <button role="tab" data-view="train" aria-selected="true">Practice</button>
  <button role="tab" data-view="learn" aria-selected="false">Learn</button>
  <button role="tab" data-view="progress" aria-selected="false">Progress</button>
  <button role="tab" data-view="settings" aria-selected="false">Settings</button>
</nav>

<section class="view on" id="view-train">
  <p class="lead">Tap any note to select it and hear it. Hold to sustain the tone. Dashed notes are bends.</p>
  <div class="harp-scroll">
    <div class="rowlbl"><span>Blow bends</span></div>
    <div class="harp" id="harp"></div>
    <div class="rowlbl"><span>Draw bends</span></div>
  </div>
  <div class="tone-row">
    <label>Volume <input type="range" id="vol" min="0" max="1" step="0.01"></label>
    <label>Tone <select id="timbre"><option value="sine">Pure reference</option><option value="reed">Reed-like</option></select></label>
    <label><input type="checkbox" id="directMode"> Direct-hit mode</label>
  </div>
</section>

<section class="view" id="view-learn">
  <div id="levelList"></div>
  <div id="lessonPanel" hidden></div>
</section>

<section class="view" id="view-progress"><div id="progressBody"></div></section>

<section class="view" id="view-settings">
  <div class="set">
    <label>Gray zone (perfect tuning), ± cents <input type="number" id="sGray" min="2" max="40" step="1"><small>Target counts as reached inside this range.</small></label>
    <label>Blue zone (laser accurate), ± cents <input type="number" id="sBlue" min="1" max="20" step="1"><small>Must be smaller than the gray zone.</small></label>
    <label>Attack window, ms <input type="number" id="sTrans" min="40" max="400" step="10"><small>Pitch right after the note starts is shown but not scored for held bends.</small></label>
    <label>Required time in zone to count as reached, ms <input type="number" id="sReach" min="100" max="1000" step="50"></label>
    <label>Noise gate <input type="number" id="sGate" min="0.001" max="0.1" step="0.001"><small>Raise it if room noise registers as a note. Watch the level bar next to the microphone button.</small></label>
    <label>Reference pitch A4 <b>440 Hz</b><small>Equal temperament. Every target and reference tone is calculated from A4 = 440 Hz.</small></label>
    <div class="row"><button class="btn" id="resetBtn">Reset all progress</button></div>
    <p class="sync" id="syncTxt">Progress is saved in this browser.</p>
  </div>
</section>
</div>
<script>
// ===================== BendLab core (no DOM) =====================
// All tunable thresholds live here. UI reads from CONFIG; nothing else hard-codes them.
const CONFIG = {
  A4: 440,
  grayCents: 10,        // perfect-tuning zone (±)
  blueCents: 3,         // laser-accurate zone (±), nested inside gray
  transientMs: 150,     // attack window after onset: shown, not scored for sustain
  onsetFrames: 3,       // consecutive voiced frames needed to start an attempt
  releaseMs: 200,       // silence needed to end an attempt
  reachMs: 250,         // continuous time in gray to count as "reached"
  holdGraceMs: 80,      // brief dropouts tolerated before a hold resets
  stableWindowMs: 120,  // window for "initial stable pitch"
  stableStdCents: 6,    // max std-dev (cents) for a window to count as stable
  overshootCents: 30,   // this far flat of target = overshoot
  stallMs: 450,         // steady this long, still sharp, = stalled
  discoverDropCents: 40,// Level 1: drop needed from start pitch
  discoverHoldMs: 120,
  minAttemptMs: 250,    // shorter voiced blips are ignored
  noiseGate: 0.006,     // RMS below this = silence
  yinThreshold: 0.15,
  minFreq: 110,
  maxFreq: 4200,
};

const PC_NAMES = ['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const pcName = m => PC_NAMES[((m % 12) + 12) % 12];
const noteName = m => pcName(m) + (Math.floor(m / 12) - 1);
const midiToFreq = m => CONFIG.A4 * Math.pow(2, (m - 69) / 12);
const freqToMidi = f => 69 + 12 * Math.log2(f / CONFIG.A4);
const centsBetween = (f, ref) => 1200 * Math.log2(f / ref);

// Harmonica keys: offset in semitones from a standard C harp (hole 1 blow = C4)
const KEYS = [
  { id: 'G', name: 'G', off: -5 }, { id: 'Ab', name: 'A♭', off: -4 },
  { id: 'A', name: 'A', off: -3 }, { id: 'Bb', name: 'B♭', off: -2 },
  { id: 'B', name: 'B', off: -1 }, { id: 'C', name: 'C', off: 0 },
  { id: 'Db', name: 'D♭', off: 1 }, { id: 'D', name: 'D', off: 2 },
  { id: 'Eb', name: 'E♭', off: 3 }, { id: 'E', name: 'E', off: 4 },
  { id: 'F', name: 'F', off: 5 }, { id: 'Fs', name: 'F♯', off: 6 },
  { id: 'LF', name: 'Low F', off: -7 }, { id: 'LD', name: 'Low D', off: -10 },
];

// Richter tuning, C harmonica, MIDI numbers
const RICHTER_BLOW = [60, 64, 67, 72, 76, 79, 84, 88, 91, 96];
const RICHTER_DRAW = [62, 67, 71, 74, 77, 81, 83, 86, 89, 93];
const PRIMES = ['', '′', '″', '‴'];
const STEP_WORDS = ['', 'half step', 'whole step', '1½ step'];

function makeNote(hole, dir, bend, midi) {
  const id = `${hole}${dir === 'draw' ? 'D' : 'B'}${bend || ''}`;
  const tab = (dir === 'draw' ? '−' : '+') + hole + PRIMES[bend];
  const desc = `${hole} ${dir}` + (bend ? ` bend, ${STEP_WORDS[bend]}` : '');
  return { id, hole, dir, bend, midi, freq: midiToFreq(midi), name: noteName(midi), pc: pcName(midi), tab, desc };
}

// Conventional bends only: on each hole the higher reed bends down toward (not onto) the lower reed.
function buildHarp(keyId) {
  const key = KEYS.find(k => k.id === keyId) || KEYS[5];
  const holes = [];
  const all = {};
  for (let i = 0; i < 10; i++) {
    const hole = i + 1;
    const blow = RICHTER_BLOW[i] + key.off, draw = RICHTER_DRAW[i] + key.off;
    const h = { hole, blow: makeNote(hole, 'blow', 0, blow), draw: makeNote(hole, 'draw', 0, draw), blowBends: [], drawBends: [] };
    for (let k = 1; k < draw - blow; k++) h.drawBends.push(makeNote(hole, 'draw', k, draw - k));
    for (let k = 1; k < blow - draw; k++) h.blowBends.push(makeNote(hole, 'blow', k, blow - k));
    holes.push(h);
    [h.blow, h.draw, ...h.blowBends, ...h.drawBends].forEach(n => (all[n.id] = n));
  }
  return { key, holes, notes: all };
}

// The full pitch path for a note's hole and direction: natural first, then each bend deeper.
function ladderFor(harp, note) {
  const h = harp.holes[note.hole - 1];
  return note.dir === 'draw' ? [h.draw, ...h.drawBends] : [h.blow, ...h.blowBends];
}

function allBends(harp) {
  return harp.holes.flatMap(h => [...h.drawBends, ...h.blowBends]);
}

// ---------------- YIN pitch detector ----------------
// de Cheveigné & Kawahara (2002): difference function, cumulative-mean normalisation,
// absolute threshold, parabolic interpolation on the raw difference function.
function createDetector(maxSize) {
  let d = new Float32Array(maxSize), c = new Float32Array(maxSize);
  return function detect(buf, sr) {
    const n = buf.length;
    const tauMax = Math.min(Math.floor(sr / CONFIG.minFreq), (n >> 1) - 2);
    const tauMin = Math.max(2, Math.floor(sr / CONFIG.maxFreq));
    if (d.length < tauMax + 2) { d = new Float32Array(tauMax + 2); c = new Float32Array(tauMax + 2); }
    const W = n - tauMax - 1;
    for (let tau = 1; tau <= tauMax + 1; tau++) {
      let s = 0;
      for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }
      d[tau] = s;
    }
    let cum = 0;
    c[0] = 1;
    for (let tau = 1; tau <= tauMax + 1; tau++) { cum += d[tau]; c[tau] = cum > 0 ? (d[tau] * tau) / cum : 1; }
    let tau = -1;
    for (let t = tauMin; t <= tauMax; t++) {
      if (c[t] < CONFIG.yinThreshold) {
        while (t + 1 <= tauMax && c[t + 1] < c[t]) t++;
        tau = t; break;
      }
    }
    if (tau < 0) {
      let best = Infinity, bt = -1;
      for (let t = tauMin; t <= tauMax; t++) if (c[t] < best) { best = c[t]; bt = t; }
      if (best > 0.3 || bt < 0) return null;
      tau = bt;
    }
    let better = tau;
    if (tau > 1 && tau <= tauMax) {
      const a = d[tau - 1], b = d[tau], e = d[tau + 1];
      const den = a - 2 * b + e;
      if (den > 0) better = tau + (0.5 * (a - e)) / den;
    }
    // Multi-period refinement: short lags (high notes) have coarse resolution, so measure the
    // lag of k whole periods instead and divide by k.
    // Doubling k each pass keeps every search within ±1 sample of the previous estimate.
    const Wk = n - tauMax - 4;
    const dAt = T => { let s = 0; for (let i = 0; i < Wk; i++) { const x = buf[i] - buf[i + T]; s += x * x; } return s; };
    for (let k = 2; k * better <= tauMax + 1; k *= 2) {
      const T0 = Math.round(k * better);
      let bestT = T0, bestV = dAt(T0);
      for (const T of [T0 - 1, T0 + 1]) { const v = dAt(T); if (v < bestV) { bestV = v; bestT = T; } }
      const a = dAt(bestT - 1), e = dAt(bestT + 1), den = a - 2 * bestV + e;
      const refined = (bestT + (den > 0 ? (0.5 * (a - e)) / den : 0)) / k;
      if (Math.abs(refined - better) < 0.5) better = refined; else break;
    }
    return { freq: sr / better, conf: 1 - c[tau] };
  };
}

function rmsOf(buf) { let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return Math.sqrt(s / buf.length); }

function meanStd(arr) {
  if (!arr.length) return { mean: 0, std: 0 };
  let m = 0; for (const v of arr) m += v; m /= arr.length;
  let v2 = 0; for (const v of arr) v2 += (v - m) * (v - m);
  return { mean: m, std: Math.sqrt(v2 / arr.length) };
}

function slopePerSec(samples) { // linear regression slope of cents vs time, cents per second
  const n = samples.length; if (n < 4) return 0;
  let st = 0, sc = 0; for (const s of samples) { st += s.t; sc += s.c; }
  const mt = st / n, mc = sc / n; let num = 0, den = 0;
  for (const s of samples) { num += (s.t - mt) * (s.c - mc); den += (s.t - mt) * (s.t - mt); }

}

const fmtCents = c => { const r = Math.round(c); return (r < 0 ? '−' + -r : r > 0 ? '+' + r : '0') + '¢'; };

// ---------------- Attempt tracker ----------------
// Observes the whole note; separates attack, movement and stable hold. Only hold runs are scored
// for sustained accuracy; the whole trajectory is kept for coaching.
class Tracker {
  constructor(cfg) { this.cfg = cfg; this.onFinish = null; this.target = null; this.mode = 'sustain'; }
  setTarget(note, ladder, mode) {
    this.target = note; this.ladder = ladder; this.mode = mode || 'sustain';
    this.nat = ladder[0];
    this.natF = midiToFreq(this.nat.midi);
    this.targetNat = (note.midi - this.nat.midi) * 100; // target position in cents relative to natural
    const lowest = ladder[ladder.length - 1];
    this.winLo = midiToFreq(lowest.midi) * Math.pow(2, -450 / 1200);
    this.winHi = this.natF * Math.pow(2, 450 / 1200);
    this.abort();
  }
  abort() { this.att = null; this.pending = []; this.med = []; this.live = { active: false }; }
  fold(f) { // correct octave errors into this hole's window when unambiguous
    if (!f) return null;
    if (f >= this.winLo && f <= this.winHi) return f;
    for (const m of [2, 0.5]) { const g = f * m; if (g >= this.winLo && g <= this.winHi) return g; }
    return null;
  }
  feed(t, rawF) {
    const cfg = this.cfg;
    const f = this.fold(rawF);
    let zoneNat = null;
    if (f) {
      const cn = centsBetween(f, this.natF);
      this.med.push(cn); if (this.med.length > 3) this.med.shift();
      zoneNat = [...this.med].sort((a, b) => a - b)[this.med.length >> 1];
    } else {
      this.med.length = 0;
    }
    if (!this.att) {
      if (f) {
        this.pending.push({ t, cn: centsBetween(f, this.natF) });
        if (this.pending.length >= cfg.onsetFrames) this.start();
      } else this.pending.length = 0;
      if (!this.att) { this.live = { active: false, outOfRange: !!rawF && !f, rawF }; return this.live; }
      return this.process(t, f, zoneNat, true);
    }
    return this.process(t, f, zoneNat, false);
  }
  start() {
    const t0 = this.pending[0].t;
    this.att = {
      t0, samples: [], lastVoicedT: t0, prevT: t0,
      grayStart: null, lastGrayT: null, holdRuns: [], reached: false, reachedT: null, timeToTarget: null,
      blueStart: null, lastBlueT: null, blueMs: 0, longestBlue: 0,
      initial: null, initialT: null, startNat: null, minNat: Infinity, maxNat: -Infinity,
      bending: false, overshootFlag: false, overshoots: 0, maxOvershoot: 0,
      stalled: false, stalls: 0, dir: 0, ext: null, reversals: 0,
      visited: new Set(), discoverStart: null, discoverMs: 0, discovered: false, everPostAttack: false,
    };
    for (const p of this.pending) this.att.samples.push({ t: p.t, cn: p.cn, c: p.cn - this.targetNat, attack: true });
    this.pending = [];
  }
  closeGray(a) {
    if (a.grayStart == null) return;
    const dur = a.lastGrayT - a.grayStart;
    if (dur >= this.cfg.reachMs) a.holdRuns.push({ start: a.grayStart, end: a.lastGrayT, dur });
    a.grayStart = null; a.lastGrayT = null;
  }
  closeBlue(a) {
    if (a.blueStart == null) return;
    a.longestBlue = Math.max(a.longestBlue, a.lastBlueT - a.blueStart);
    a.blueStart = null; a.lastBlueT = null;
  }
  process(t, f, zoneNat, justStarted) {
    const cfg = this.cfg, a = this.att;
    const elapsed = t - a.t0;
    const inAttack = elapsed < cfg.transientMs;
    if (!f) {
      if (a.grayStart != null && t - a.lastGrayT > cfg.holdGraceMs) this.closeGray(a);
      if (a.blueStart != null && t - a.lastBlueT > cfg.holdGraceMs) this.closeBlue(a);
      if (t - a.lastVoicedT > cfg.releaseMs) { this.finish(); return this.live; }
      this.live = { ...this.live, voiced: false, holdMs: a.grayStart != null ? a.lastGrayT - a.grayStart : 0 };
      return this.live;
    }
    const cn = centsBetween(f, this.natF);
    const dt = Math.min(50, t - a.prevT);
    a.prevT = t; a.lastVoicedT = t;
    if (!justStarted) a.samples.push({ t, cn, c: cn - this.targetNat, attack: inAttack });
    const zc = zoneNat - this.targetNat; // median-filtered cents relative to target
    const inGray = Math.abs(zc) <= cfg.grayCents;
    const inBlue = Math.abs(zc) <= cfg.blueCents;
    a.minNat = Math.min(a.minNat, zoneNat); a.maxNat = Math.max(a.maxNat, zoneNat);
    this.ladder.forEach(n => { if (Math.abs(zoneNat - (n.midi - this.nat.midi) * 100) <= 15) a.visited.add(n.id); });

    let drift = null, stable = false, recentStd = null;
    if (!inAttack) {
      a.everPostAttack = true;
      // initial stable pitch (direct-hit measurement)
      const win = a.samples.filter(s => !s.attack && t - s.t <= cfg.stableWindowMs);
      if (win.length >= 4) {
        const ms = meanStd(win.map(s => s.cn));
        recentStd = ms.std;
        stable = ms.std <= cfg.stableStdCents;
        if (a.initial == null && stable && t - (a.t0 + cfg.transientMs) >= cfg.stableWindowMs * 0.8) {
          a.initial = ms.mean - this.targetNat; a.initialT = t; a.startNat = ms.mean;

      // movement: bending detected once pitch falls clearly below where it started
      const ref = a.startNat != null ? a.startNat : 0;
      if (zoneNat < Math.min(ref, 0) - 20) a.bending = true;
      // reversals with hysteresis
      if (a.ext == null) a.ext = zoneNat;
      if (a.dir <= 0 && zoneNat > a.ext + 15) { if (a.dir < 0) a.reversals++; a.dir = 1; a.ext = zoneNat; }
      else if (a.dir >= 0 && zoneNat < a.ext - 15) { if (a.dir > 0) a.reversals++; a.dir = -1; a.ext = zoneNat; }
      else a.ext = a.dir > 0 ? Math.max(a.ext, zoneNat) : a.dir < 0 ? Math.min(a.ext, zoneNat) : a.ext;
      // gray run (hold)
      if (inGray) { if (a.grayStart == null) a.grayStart = t; a.lastGrayT = t; }
      else if (a.grayStart != null && t - a.lastGrayT > cfg.holdGraceMs) this.closeGray(a);
      const holdMs = a.grayStart != null ? a.lastGrayT - a.grayStart : 0;
      if (!a.reached && holdMs >= cfg.reachMs) { a.reached = true; a.reachedT = t; a.timeToTarget = a.grayStart - a.t0; }
      // blue run
      if (inBlue) { if (a.blueStart == null) a.blueStart = t; a.lastBlueT = t; if (holdMs > 0) a.blueMs += dt; }
      else if (a.blueStart != null && t - a.lastBlueT > cfg.holdGraceMs) this.closeBlue(a);
      // overshoot
      if (zc < -cfg.overshootCents) {
        if (!a.overshootFlag) { a.overshootFlag = true; a.overshoots++; }
        a.maxOvershoot = Math.max(a.maxOvershoot, -zc);
      } else if (zc > -cfg.grayCents) a.overshootFlag = false;
      // stall: steady but still sharp of the target
      const stallWin = a.samples.filter(s => !s.attack && t - s.t <= cfg.stallMs);
      const wasStalled = a.stalled;
      a.stalled = a.bending && !inGray && zc > cfg.grayCents && stallWin.length >= 8 && stallWin[0].t <= t - cfg.stallMs * 0.9 &&
        meanStd(stallWin.map(s => s.cn)).std < 5;
      if (a.stalled && !wasStalled) a.stalls++;
      // drift within the current hold
      if (holdMs >= 400) {
        const hs = a.samples.filter(s => s.t >= Math.max(a.grayStart, t - 600)).map(s => ({ t: s.t, c: s.c }));
        const sl = slopePerSec(hs);
        if (sl > 10 && zc > cfg.blueCents) drift = 'sharp';
        else if (sl < -10 && zc < -cfg.blueCents) drift = 'flat';
      }
      // Level 1 discovery: clear, sustained drop from a start near the natural note
      if (a.startNat != null && a.startNat > -30 && zoneNat <= a.startNat - cfg.discoverDropCents) {
        if (a.discoverStart == null) a.discoverStart = t;
        a.discoverMs = t - a.discoverStart;
        if (a.discoverMs >= cfg.discoverHoldMs) a.discovered = true;
      } else a.discoverStart = null;
      this.live = {
        active: true, voiced: true, phase: inGray && holdMs >= cfg.reachMs ? 'hold' : 'move', elapsed,
        f, zoneNat, zoneCents: zc, inGray, inBlue, holdMs,
        blueRunMs: a.blueStart != null ? a.lastBlueT - a.blueStart : 0,
        reached: a.reached, bending: a.bending, stalled: a.stalled, drift, stable, recentStd,
        overshooting: a.overshootFlag, initial: a.initial, startNat: a.startNat,
        discovered: a.discovered, discoverMs: a.discoverMs,
      };
    } else {
      this.live = { active: true, voiced: true, phase: 'attack', elapsed, f, zoneNat, zoneCents: zc, inGray, inBlue, holdMs: 0, blueRunMs: 0 };
    }
    return this.live;
  }
  finish() {
    const a = this.att; this.att = null; this.pending = []; this.med = [];
    this.closeGray(a); this.closeBlue(a);
    const dur = a.lastVoicedT - a.t0;
    this.live = { active: false };
    if (dur < this.cfg.minAttemptMs || !a.everPostAttack) return;
    const holdSamples = a.samples.filter(s => !s.attack && a.holdRuns.some(r => s.t >= r.start && s.t <= r.end));
    const hs = meanStd(holdSamples.map(s => s.c));
    const longest = a.holdRuns.reduce((m, r) => (r.dur > m.dur ? r : m), { dur: 0 });
    const longestSamples = holdSamples.filter(s => s.t >= longest.start && s.t <= longest.end);
    const minC = a.minNat - this.targetNat;
    const result = {
      noteId: this.target.id, mode: this.mode, duration: dur,
      reached: a.reached, timeToTarget: a.timeToTarget,
      longestHold: longest.dur, holdMean: holdSamples.length ? hs.mean : null,
      holdMeanAbs: holdSamples.length ? meanStd(holdSamples.map(s => Math.abs(s.c))).mean : null,
      jitter: holdSamples.length ? hs.std : null,
      drift: longestSamples.length >= 4 ? slopePerSec(longestSamples) : null,

      stalls: a.stalls, reversals: a.reversals,
      initialCents: a.initial,
      initialHit: a.initial != null && Math.abs(a.initial) <= this.cfg.grayCents,
      startedAboveSlid: a.initial != null && a.initial > this.cfg.grayCents && a.reached,
      visited: this.ladder.filter(n => a.visited.has(n.id) && n.id !== this.target.id).map(n => n.pc),
      bent: a.bending, discovered: a.discovered,
      maxDrop: a.startNat != null && isFinite(a.minNat) ? a.minNat - a.startNat : null,
    };
    this.lastResult = result;
    if (this.onFinish) this.onFinish(result);
  }
}

function coachMessage(tr) {
  const L = tr.live || {}, cfg = tr.cfg, tgt = tr.target;
  if (!tgt) return '';
  if (!L.active) {
    if (L.outOfRange) return `That pitch is outside hole ${tgt.hole} ${tgt.dir}. Check the hole and direction.`;
    if (tr.mode === 'direct') return `Attack ${tgt.pc} directly, without sliding down from ${tr.nat.pc}.`;
    if (tr.mode === 'discover') return `Play ${tr.nat.desc} (${tr.nat.pc}), then try to lower the pitch.`;
    return tgt.bend > 0 ? `Start from the natural note, ${tr.nat.pc}, then bend down to ${tgt.pc}.` : `Play ${tgt.desc} (${tgt.pc}).`;
  }
  if (!L.voiced) return 'Keep the note going.';
  if (L.phase === 'attack') return 'Listening…';
  const c = L.zoneCents, ac = Math.abs(Math.round(c));
  if (tr.mode === 'discover') {
    if (L.startNat != null && L.startNat < -30) return 'Start from the natural note, then lower the pitch.';
    if (L.discovered) return 'That is a bend. Your pitch moved down.';
    if (L.startNat != null && L.zoneNat < L.startNat - 12) return 'Good. Your pitch is beginning to move.';
    return 'Now try to lower the pitch.';
  }
  if (L.inGray) {
    if (L.drift === 'sharp') return "You're drifting sharp.";
    if (L.drift === 'flat') return "You're drifting flat.";
    if (L.inBlue && L.holdMs >= cfg.reachMs) return `Laser accurate: ${fmtCents(c)}`;
    if (L.holdMs < cfg.reachMs) return 'Target reached. Hold it.';
    if (L.holdMs > 1500) return 'Stable bend.';
    return 'Hold it.';
  }
  if (c < 0) {
    if (tgt.bend === 0) return `${ac} cents flat. Ease off the bend.`;
    if (-c >= cfg.overshootCents) return 'You passed the target. Release the bend slightly.';
    return `${ac} cents flat. Release slightly.`;
  }
  if (tgt.bend > 0 && !L.bending && L.zoneNat > -15)
    return tr.mode === 'direct' ? `${ac} cents sharp. You started on the natural note.` : 'Good start. Now bend lower.';
  if (L.stalled) return `Pitch stalled ${ac} cents sharp. Keep bending lower.`;
  if (ac <= 25) return `Almost there. ${ac} cents sharp.`;
  if (L.bending) return `Keep bending lower. ${ac} cents sharp.`;
  return `You're ${ac} cents sharp of the target.`;
}

// ---------- persistence: this browser, plus the viewer's private account storage when available ----------
const Store = {
  KEY: 'bendlab.v1',
  data: null,
  defaults() { return { v: 1, updatedAt: 0, stats: {}, levels: {}, settings: { key: 'C', gray: 10, blue: 3, transient: 150, reach: 250, gate: 0.006, timbre: 'sine', volume: 0.5, target: '4D1' } }; },
  load() {
    this.data = this.defaults();
    try { const s = localStorage.getItem(this.KEY); if (s) this.merge(JSON.parse(s)); } catch (e) {}
  },
  merge(d) {
    if (!d || typeof d !== 'object') return;
    const base = this.defaults();
    this.data = { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) }, stats: d.stats || {}, levels: d.levels || {} };
  },
  save() {
    this.data.updatedAt = Date.now();
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {}
    clearTimeout(this.t); this.t = setTimeout(() => this.push(), 2500);
  },
  async push() { if (!this.ref) return; try { await this.ref.set(JSON.parse(JSON.stringify(this.data))); } catch (e) {} },
  async initRemote() {
    try {
      if (!window.claude || !window.claude.use) return;

      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.ref = db.doc(`data/users/${id}/bendlab/progress`);
      const snap = await this.ref.get();
      if (snap.exists) {
        const d = snap.data();
        if (d && (d.updatedAt || 0) > (this.data.updatedAt || 0)) { this.merge(d); try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} applySettings(); rebuildHarp(); renderProgress(); renderLevels(); }
      } else this.push();
      $('syncTxt').textContent = 'Progress is saved to your account and this browser.';

};

// ---------- reference tone generator (Web Audio) ----------
function ensureCtx() {
  if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.ctx.state === 'suspended') audio.ctx.resume();

}
const Tone = {
  voice: null, blockUntil: 0, timer: null, wave: null,
  start(freq) {
    const ctx = ensureCtx(); this.stop(true);

    if (Store.data.settings.timbre === 'reed') {

        const amps = [0, 1, .72, .5, .38, .3, .2, .14, .1, .07, .05];
        this.wave = ctx.createPeriodicWave(new Float32Array(amps.length), new Float32Array(amps));
      }

    } else o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.015);

  stopAfter(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.stop(), ms); },
  stop(immediate) {

function showNotice(msg) { const n = $('micNotice'); n.textContent = msg; n.classList.toggle('on', !!msg); }

function rebuildHarp() {

// ---------- main loop ----------
function frame() {

  if (audio.on && audio.analyser) {
    audio.analyser.getFloatTimeDomainData(audio.buf);

  }
  rmsSmooth = rmsSmooth * 0.8 + rms * 0.2;
  $('lvl').style.width = clamp(Math.sqrt(rmsSmooth / 0.2), 0, 1) * 100 + '%';
  const L = audio.on && !blocked ? tracker.feed(now, rawF) : { active: false };
  if (prevActive && !L.active && lesson) lesson.attemptDone = false;

  } else { hist.push({ t: now, v: null }); if (!L.active) disp = null; }
  while (hist.length && now - hist[0].t > 5200) hist.shift();

  // readouts
  const dc = disp != null ? disp - tracker.targetNat : null;
  const big = $('cents');

  } else { big.textContent = '—'; big.className = 'big idle'; }

    lastRaw = now;

  laser.classList.toggle('on', isLaser);

  $('phase').textContent = !audio.on ? 'Microphone off' : blocked ? 'Reference playing' : !L.active ? 'Waiting for a note' : L.phase === 'attack' ? 'Attack' : L.phase === 'hold' ? 'Holding' : 'Moving';

  const useBlue = lesson && lesson.step.req.type === 'blue';
  const hv = L.active ? (useBlue ? L.blueRunMs : L.holdMs) || 0 : 0;
  const hf = $('holdFill'); hf.style.width = clamp(hv / goal, 0, 1) * 100 + '%'; hf.classList.toggle('blue', !!(useBlue || (L.active && L.inBlue)));
  $('holdTxt').textContent = (useBlue ? 'Blue ' : 'Hold ') + (hv / 1000).toFixed(1) + ' s';
  $('coach').textContent = !audio.on ? 'Start the microphone to begin. Real-time training needs to hear your harmonica.' : blocked ? 'Listen to the target.' : coachMessage(tracker);

  drawMeter(now); drawZone(dc);
}

// ---------- wiring ----------
function init() {
  Store.load();
  $('keySel').innerHTML = KEYS.map(k => `<option value="${k.id}">${k.name}</option>`).join('');
  practiceTargetId = Store.data.settings.target || '4D1';
  applySettings(); readColors(); rebuildHarp(); renderLevels(); renderProgress();
  $('micBtn').onclick = toggleMic;
  $('hearBtn').onclick = () => Tone.play(target.freq, 2000);
  $('stopBtn').onclick = () => Tone.stop();
  $('keySel').onchange = e => { Store.data.settings.key = e.target.value; Store.save(); rebuildHarp(); if (lesson) renderLesson(); renderProgress(); };
  $('vol').oninput = e => { Store.data.settings.volume = +e.target.value; Store.save(); if (Tone.voice) Tone.voice.g.gain.setTargetAtTime(+e.target.value * 0.5, audio.ctx.currentTime, 0.02); };
  $('timbre').onchange = e => { Store.data.settings.timbre = e.target.value; Store.save(); };
  $('directMode').onchange = () => { if (!lesson) setTarget(practiceTargetId); };
  const num = (id, key, lo, hi) => $(id).onchange = e => { const v = clamp(+e.target.value || 0, lo, hi); Store.data.settings[key] = v; Store.save(); applySettings(); updateHoldGoal(); };
  num('sGray', 'gray', 2, 40); num('sBlue', 'blue', 1, 20); num('sTrans', 'transient', 40, 400); num('sReach', 'reach', 100, 1000); num('sGate', 'gate', 0.001, 0.1);
  $('resetBtn').onclick = () => { if (confirm('Reset all stats and level progress?')) { Store.data.stats = {}; Store.data.levels = {}; Store.save(); renderProgress(); renderLevels(); } };
  document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
    view = b.dataset.view;
    document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + view));
    if (view === 'progress') renderProgress();
  });
  showNotice('Real-time training requires microphone access. Tap Start microphone and allow access when asked.');
  requestAnimationFrame(frame);
  Store.initRemote();
}
init();
</script>
</body></html>
