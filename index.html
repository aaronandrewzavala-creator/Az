const KEY_LABELS = { C: "Key of C", G: "Key of G" };

function flattenTargets(table) {
  return table.flatMap(h => ([
    { hole: h.hole, action: "blow", note: h.blow.note, freq: h.blow.freq },
    { hole: h.hole, action: "draw", note: h.draw.note, freq: h.draw.freq },
  ]));
}

/* ===========================================================
   NOTE MATH
=========================================================== */
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function centsBetween(freqA, freqB) {
  return 1200 * Math.log2(freqA / freqB);
}

function nearestChromaticNote(freq) {
  if (!freq || freq <= 0) return null;
  const midi = 69 + 12 * Math.log2(freq / 440);
  const rounded = Math.round(midi);
  const exactFreq = 440 * Math.pow(2, (rounded - 69) / 12);
  const cents = centsBetween(freq, exactFreq);
  const name = NOTE_NAMES[((rounded % 12) + 12) % 12];
  const octave = Math.floor(rounded / 12) - 1;
  return { name, octave, cents, exactFreq };
}

/* ===========================================================
   HARMONICA LOGIC
   nearestHarmonicaTarget: closest hole/action for a raw frequency,
   given the currently selected key's target list.

   detectBend(): EXTENSION SEAM, not yet implemented.
   Bending flattens a reed's pitch below its natural target (draw
   bends on holes 1-6, blow bends on holes 7-10, overblow/overdraw
   elsewhere). To add it: once a stable frequency sits more than
   ~35 cents flat of its nearest target AND is closer to that
   target than to any *other* target a half-step below it, treat
   it as a bend of that reed rather than "out of tune", and report
   how many cents/semitones below the natural note it is. That
   needs its own confidence gate (bent notes are quieter and have
   more overtone noise than straight notes), which is why it isn't
   folded into nearestHarmonicaTarget's plain nearest-neighbor
   search today.
=========================================================== */
function nearestHarmonicaTarget(freq, targets) {
  if (!freq || freq <= 0) return null;
  let best = null;
  let bestAbsCents = Infinity;
  for (const t of targets) {
    const cents = centsBetween(freq, t.freq);
    const abs = Math.abs(cents);
    if (abs < bestAbsCents) {
      bestAbsCents = abs;
      best = { ...t, cents };
    }
  }
  return best;
}

// Stub kept intentionally inert (always returns null) — see comment above.
// eslint-disable-next-line no-unused-vars
function detectBend(stableFreq, targets) {
  return null;
}

/* ===========================================================
   PITCH ENGINE — autocorrelation with parabolic interpolation
   and a normalized-correlation confidence score.
=========================================================== */
function autocorrelate(buffer, sampleRate) {
  const SIZE = buffer.length;
  const NO_MATCH = { freq: -1, confidence: 0 };

  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.008) return NO_MATCH;

  let r1 = 0, r2 = SIZE - 1;
  const threshold = 0.2;
  for (let i = 0; i < SIZE / 2; i++) {
    if (Math.abs(buffer[i]) > threshold) { r1 = i; break; }
  }
  for (let i = 1; i < SIZE / 2; i++) {
    if (Math.abs(buffer[SIZE - i]) > threshold) { r2 = SIZE - i; break; }
  }
  const trimmed = buffer.slice(r1, r2);
  const n = trimmed.length;
  if (n < 512) return NO_MATCH;

  const c = new Array(n).fill(0);
  for (let lag = 0; lag < n; lag++) {
    let sum = 0;
    for (let i = 0; i < n - lag; i++) sum += trimmed[i] * trimmed[i + lag];
    c[lag] = sum;
  }

  let d = 0;
  while (d < n - 1 && c[d] > c[d + 1]) d++;

  let maxVal = -1, maxPos = -1;
  for (let i = d; i < n; i++) {
    if (c[i] > maxVal) { maxVal = c[i]; maxPos = i; }
  }
  if (maxPos <= 0) return NO_MATCH;

  const confidence = c[0] > 0 ? Math.max(0, Math.min(1, maxVal / c[0])) : 0;

  let T0 = maxPos;
  const x1 = c[T0 - 1] || c[T0];
  const x2 = c[T0];
  const x3 = c[T0 + 1] || c[T0];
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  if (a !== 0) T0 = T0 - b / (2 * a);

  const freq = sampleRate / T0;
  if (freq < 60 || freq > 3000) return NO_MATCH;
  return { freq, confidence };
}

function useStableFrequency(rawFreq, historyLen = 6) {
  const historyRef = useRef([]);
  const [stable, setStable] = useState(null);
  useEffect(() => {
    if (rawFreq == null) { historyRef.current = []; setStable(null); return; }
    const hist = historyRef.current;
    hist.push(rawFreq);
    if (hist.length > historyLen) hist.shift();
    const sorted = [...hist].sort((a, b) => a - b);
    setStable(sorted[Math.floor(sorted.length / 2)]);
  }, [rawFreq]);
  return stable;
}

function useStableConfidence(rawConfidence, historyLen = 6) {
  const historyRef = useRef([]);
  const [stable, setStable] = useState(0);
  useEffect(() => {
    if (rawConfidence == null) { historyRef.current = []; setStable(0); return; }
    const hist = historyRef.current;
    hist.push(rawConfidence);
    if (hist.length > historyLen) hist.shift();
    setStable(hist.reduce((s, v) => s + v, 0) / hist.length);
  }, [rawConfidence]);
  return stable;
}

/* ===========================================================
   ENVIRONMENT DETECTION
   Distinguish "the platform won't allow this context to use the
   mic at all" from an ordinary user-declined prompt, so the
   message people see actually tells them what to do.
=========================================================== */
function diagnoseEnvironment() {
  const inIframe = window.top !== window.self;
  const secure = typeof window.isSecureContext === "boolean" ? window.isSecureContext : location.protocol === "https:";
  const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const hasAudioContext = !!(window.AudioContext || window.webkitAudioContext);
  return { inIframe, secure, hasMediaDevices, hasAudioContext };
}

/* ===========================================================

=========================================================== */
function TuningMeter({ cents }) {
  const clamped = cents == null ? 0 : Math.max(-50, Math.min(50, cents));
  const pct = 50 + (clamped / 50) * 50;
  const inTune = cents != null && Math.abs(cents) <= 6;
  const label = cents == null ? "—" : (cents > 6 ? "SHARP" : cents < -6 ? "FLAT" : "IN TUNE");
  const labelColor = cents == null ? "text-[var(--cream-dim)]" : inTune ? "text-[var(--brass-bright)]" : "text-[var(--danger)]";
  return (
    <div className="w-full">
      <div className="flex items-center justify-between mb-1.5">
        <span className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)]">FLAT</span>
        <span className={`font-mono text-[11px] tracking-widest font-medium ${labelColor}`}>{label}</span>
        <span className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)]">SHARP</span>
      </div>
      <div className="relative h-2.5 rounded-full needle-track brass-edge overflow-visible">
        <div
          className="absolute top-1/2 w-0.5 h-5 rounded-full transition-all duration-150 ease-out"
          style={{
            left: `${pct}%`, transform: "translate(-50%, -50%)",
            background: inTune ? "var(--brass-bright)" : "var(--cream)",
            boxShadow: inTune ? "0 0 10px 2px rgba(232,196,104,0.8)" : "0 0 6px 1px rgba(242,232,213,0.5)",

        <span className="font-mono text-[9px] text-[var(--cream-dim)]/60">0¢</span>
        <span className="font-mono text-[9px] text-[var(--cream-dim)]/60">+50¢</span>
      </div>
    </div>
  );
}

/* ===========================================================
   APP
=========================================================== */
function App() {
  const [listening, setListening] = useState(false);
  const [error, setError] = useState(null);
  const [rawFreq, setRawFreq] = useState(null);
  const [rawConfidence, setRawConfidence] = useState(0);
  const [permissionState, setPermissionState] = useState("idle");
  const [selectedKey, setSelectedKey] = useState("C");

  const audioCtxRef = useRef(null);
  const analyserRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const bufferRef = useRef(null);

  const table = HARMONICA_TABLES[selectedKey];
  const targets = useMemo(() => flattenTargets(table), [table]);

  const stableFreq = useStableFrequency(rawFreq);
  const stableConfidence = useStableConfidence(rawConfidence);

  const chromatic = useMemo(() => nearestChromaticNote(stableFreq), [stableFreq]);
  const match = useMemo(() => nearestHarmonicaTarget(stableFreq, targets), [stableFreq, targets]);

  const isLocked = match && Math.abs(match.cents) <= 45 && stableFreq != null && stableConfidence >= 0.85;
  const activeHole = isLocked ? match.hole : null;
  const activeAction = isLocked ? match.action : null;

  const tick = useCallback(() => {
    const analyser = analyserRef.current;
    const buffer = bufferRef.current;
    if (analyser && buffer && audioCtxRef.current) {
      analyser.getFloatTimeDomainData(buffer);
      const { freq, confidence } = autocorrelate(buffer, audioCtxRef.current.sampleRate);
      setRawFreq(freq > 0 ? freq : null);
      setRawConfidence(freq > 0 ? confidence : 0);
    }
    rafRef.current = requestAnimationFrame(tick);
  }, []);

  const start = async () => {
    setError(null);
    const diag = diagnoseEnvironment();

    if (diag.inIframe) {
      setError(
        "This page is running inside another site's iframe (for example, an embedded preview). " +
        "Cross-origin iframes are not granted microphone access unless the embedding page explicitly allows it, " +
        "and this one doesn't. Open this app directly — as its own tab/page at its own https:// address — and try again."
      );
      return;
    }
    if (!diag.secure) {
      setError("Microphone access requires a secure context (HTTPS). This page is not running over HTTPS, so the browser will not grant microphone access.");
      return;
    }
    if (!diag.hasMediaDevices) {
      setError("This browser environment does not expose navigator.mediaDevices.getUserMedia, so microphone capture is unavailable here.");
      return;
    }
    if (!diag.hasAudioContext) {
      setError("This browser environment does not expose the Web Audio API (AudioContext), so pitch analysis is unavailable here.");
      return;
    }

    setPermissionState("requesting");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      streamRef.current = stream;

      const AudioContextCls = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContextCls();
      audioCtxRef.current = audioCtx;
      if (audioCtx.state === "suspended") await audioCtx.resume();

      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      analyserRef.current = analyser;
      bufferRef.current = new Float32Array(analyser.fftSize);

      setPermissionState("granted");
      setListening(true);
      rafRef.current = requestAnimationFrame(tick);
    } catch (err) {
      setPermissionState("idle");
      const name = err && err.name ? err.name : "Error";
      const message = err && err.message ? err.message : String(err);
      let hint = "";
      if (name === "NotAllowedError") {
        hint = " This usually means either you (or the browser) denied the prompt, or — if you're seeing this inside an embedded preview — the embedding context isn't allowed to request the mic at all. Open this app in its own browser tab at its https:// address.";
      } else if (name === "NotFoundError") {
        hint = " No microphone was found on this device.";
      }
      setError(`${name}: ${message}${hint}`);
    }
  };

  const stop = () => {
    setListening(false);
    setPermissionState("idle");
    setRawFreq(null);
    setRawConfidence(0);
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    if (audioCtxRef.current) { audioCtxRef.current.close().catch(() => {}); audioCtxRef.current = null; }
    analyserRef.current = null;
    bufferRef.current = null;
  };

  useEffect(() => () => stop(), []);

  // Changing key mid-listen just changes what we compare against; no need to restart the mic.
  const displayNote = stableFreq != null && chromatic ? `${chromatic.name}${chromatic.octave}` : "—";
  const displayFreq = stableFreq != null ? stableFreq.toFixed(1) : "—";
  const meterCents = stableFreq != null && match ? match.cents : (stableFreq != null && chromatic ? chromatic.cents : null);

  return (
    <div className="min-h-screen flex flex-col items-center px-4 py-8 sm:py-12">
      <div className="w-full max-w-2xl text-center mb-8 rise-in">
        <div className="font-mono text-[11px] tracking-[0.35em] text-[var(--brass)] mb-2">HOLE &amp; NOTE DETECTOR</div>
        <h1 className="font-display text-4xl sm:text-5xl font-semibold text-[var(--cream)] leading-tight">Harmonica Tuner</h1>
        <p className="text-[var(--cream-dim)] mt-2 text-sm sm:text-base max-w-md mx-auto">
          Play a note into your microphone. We'll find the hole, the breath direction, and how in-tune you are.
        </p>
      </div>

      <div className="w-full max-w-2xl flex flex-col gap-6">

        <div className="grain-panel brass-edge rounded-xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4 rise-in" style={{ animationDelay: "60ms" }}>
          <div className="flex items-center gap-4">
            <div className="flex items-center gap-3">
              <div
                className="w-3 h-3 rounded-full flex-shrink-0"
                style={{ background: listening ? "var(--draw)" : "var(--brass-dim)", boxShadow: listening ? "0 0 10px 2px rgba(95,175,166,0.7)" : "none" }}
              />
              <span className="font-mono text-xs tracking-widest text-[var(--cream-dim)]">{listening ? "LISTENING" : "MICROPHONE OFF"}</span>
            </div>
            <KeySelector selectedKey={selectedKey} onChange={setSelectedKey} />
          </div>
          <button
            onClick={listening ? stop : start}
            disabled={permissionState === "requesting"}
            className="font-mono font-bold text-sm tracking-widest px-6 py-3.5 rounded-lg transition-transform active:scale-[0.97] disabled:opacity-60 w-full sm:w-auto"
            style={{
              background: listening ? "var(--danger)" : "linear-gradient(180deg, var(--brass-bright), var(--brass))",
              color: listening ? "#2A130D" : "#221805", border: "none",
              boxShadow: listening ? "0 4px 14px -4px rgba(200,84,60,0.6)" : "0 4px 14px -4px rgba(200,155,60,0.6)",
            }}
          >
            {permissionState === "requesting" ? "REQUESTING ACCESS…" : listening ? "■ STOP LISTENING" : "▶ START LISTENING"}
          </button>
        </div>

        {error && (
          <div className="rounded-xl p-4 text-sm rise-in" style={{ background: "rgba(200,84,60,0.12)", border: "1px solid rgba(200,84,60,0.4)", color: "#F0BBAE" }}>
            <div className="font-mono text-[10px] tracking-widest mb-1.5" style={{ color: "var(--danger)" }}>MICROPHONE ERROR</div>
            <div className="font-mono text-xs leading-relaxed break-words">{error}</div>
          </div>
        )}

        <div className="grain-panel brass-edge rounded-xl p-5 sm:p-6 rise-in" style={{ animationDelay: "120ms" }}>
          <div className="grid grid-cols-2 gap-6 mb-6">
            <div>
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">FREQUENCY</div>
              <div className="font-mono text-3xl sm:text-4xl font-medium text-[var(--cream)] tabular-nums">{displayFreq}<span className="text-base text-[var(--cream-dim)] ml-1">Hz</span></div>
            </div>
            <div className="text-right">
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">NOTE</div>
              <div className="font-display text-3xl sm:text-4xl font-medium text-[var(--brass-bright)]">{displayNote}</div>
            </div>
          </div>

          <TuningMeter cents={meterCents} />

          <div className="mt-4 grid grid-cols-2 gap-4">
            <div>
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">CENTS</div>
              <div className="font-mono text-lg tabular-nums" style={{ color: meterCents == null ? "var(--cream-dim)" : Math.abs(meterCents) <= 6 ? "var(--brass-bright)" : "var(--danger)" }}>
                {meterCents == null ? "—" : `${meterCents > 0 ? "+" : ""}${meterCents.toFixed(1)}¢`}
              </div>
            </div>
            <div className="text-right">
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">CONFIDENCE</div>
              <div className="font-mono text-lg tabular-nums text-[var(--cream)]">{listening ? `${Math.round(stableConfidence * 100)}%` : "—"}</div>
            </div>
          </div>

          <div className="mt-5 pt-5 flex items-center justify-between" style={{ borderTop: "1px solid rgba(200,155,60,0.15)" }}>
            <div>
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">HOLE</div>
              <div className="font-display text-2xl font-medium text-[var(--cream)]">{isLocked ? activeHole : "—"}</div>
            </div>
            <div className="text-right">
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">ACTION</div>
              <div className="font-display text-2xl font-medium uppercase" style={{ color: isLocked ? (activeAction === "blow" ? "var(--blow)" : "var(--draw)") : "var(--cream)" }}>
                {isLocked ? activeAction : "—"}
              </div>
            </div>
          </div>
        </div>

        <div className="rise-in" style={{ animationDelay: "180ms" }}>
          <HarmonicaBody table={table} activeHole={activeHole} activeAction={activeAction} />
        </div>

        <div className="rise-in" style={{ animationDelay: "240ms" }}>
          <ReferenceChart table={table} activeHole={activeHole} activeAction={activeAction} />
        </div>

        <p className="text-center text-[var(--cream-dim)]/60 text-xs pb-4">
          Best in a quiet room, holding the harmonica close to the microphone. Tuning tolerance shown is &plusmn;50 cents.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
