<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ===========================================================
   CONFIG — harmonica note tables, keyed by musical key.
=========================================================== */
const HARMONICA_TABLES = {
  C: [
    { hole: 1,  blow: { note: "C4", freq: 261.63 }, draw: { note: "D4", freq: 293.66 } },
    { hole: 2,  blow: { note: "E4", freq: 329.63 }, draw: { note: "G4", freq: 392.00 } },
    { hole: 3,  blow: { note: "G4", freq: 392.00 }, draw: { note: "B4", freq: 493.88 } },
    { hole: 4,  blow: { note: "C5", freq: 523.25 }, draw: { note: "D5", freq: 587.33 } },
    { hole: 5,  blow: { note: "E5", freq: 659.25 }, draw: { note: "F5", freq: 698.46 } },
    { hole: 6,  blow: { note: "G5", freq: 783.99 }, draw: { note: "A5", freq: 880.00 } },
    { hole: 7,  blow: { note: "C6", freq: 1046.50 }, draw: { note: "B5", freq: 987.77 } },
    { hole: 8,  blow: { note: "E6", freq: 1318.51 }, draw: { note: "D6", freq: 1174.66 } },
    { hole: 9,  blow: { note: "G6", freq: 1567.98 }, draw: { note: "F6", freq: 1396.91 } },
    { hole: 10, blow: { note: "C7", freq: 2093.00 }, draw: { note: "A6", freq: 1760.00 } },
  ],
  G: [
    { hole: 1,  blow: { note: "G3", freq: 196.00 }, draw: { note: "A3", freq: 220.00 } },
    { hole: 2,  blow: { note: "B3", freq: 246.94 }, draw: { note: "D4", freq: 293.66 } },
    { hole: 3,  blow: { note: "D4", freq: 293.66 }, draw: { note: "F#4", freq: 369.99 } },
    { hole: 4,  blow: { note: "G4", freq: 392.00 }, draw: { note: "A4", freq: 440.00 } },
    { hole: 5,  blow: { note: "B4", freq: 493.88 }, draw: { note: "C5", freq: 523.25 } },
    { hole: 6,  blow: { note: "D5", freq: 587.33 }, draw: { note: "E5", freq: 659.25 } },
    { hole: 7,  blow: { note: "G5", freq: 783.99 }, draw: { note: "F#5", freq: 739.99 } },
    { hole: 8,  blow: { note: "B5", freq: 987.77 }, draw: { note: "A5", freq: 880.00 } },
    { hole: 9,  blow: { note: "D6", freq: 1174.66 }, draw: { note: "C6", freq: 1046.50 } },
    { hole: 10, blow: { note: "G6", freq: 1567.98 }, draw: { note: "E6", freq: 1318.51 } },
  ],
};

const KEY_LABELS = { C: "Key of C", G: "Key of G" };

/* Bendable reeds on a Richter diatonic, and how many semitones
   each will pull down before the reed chokes. Identical geometry
   for every key — that's why this is keyed by hole, not by note. */
const BEND_RANGES = {
  draw: { 1: 1, 2: 2, 3: 3, 4: 1, 6: 1 },
  blow: { 8: 1, 9: 1, 10: 2 },
};
const STEP_LABELS = ["—", "\u00BD step", "1 step", "1\u00BD steps"];

function flattenTargets(table) {
  return table.flatMap(h => ([
    { hole: h.hole, action: "blow", note: h.blow.note, freq: h.blow.freq },
    { hole: h.hole, action: "draw", note: h.draw.note, freq: h.draw.freq },
  ]));
}

/* ===========================================================
   NOTE MATH
=========================================================== */
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function centsBetween(freqA, freqB) {
  return 1200 * Math.log2(freqA / freqB);
}
function freqToMidi(freq) {
  return 69 + 12 * Math.log2(freq / 440);
}
function nearestChromaticNote(freq) {
  if (!freq || freq <= 0) return null;
  const midi = freqToMidi(freq);
  const rounded = Math.round(midi);
  const exactFreq = 440 * Math.pow(2, (rounded - 69) / 12);
  const cents = centsBetween(freq, exactFreq);
  const name = NOTE_NAMES[((rounded % 12) + 12) % 12];
  const octave = Math.floor(rounded / 12) - 1;
  return { name, octave, cents, exactFreq, midi: rounded };
}

/* ===========================================================
   HARMONICA MATCHING
=========================================================== */
function nearestHarmonicaTarget(freq, targets) {
  if (!freq || freq <= 0) return null;
  let best = null;
  let bestAbsCents = Infinity;
  for (const t of targets) {
    const cents = centsBetween(freq, t.freq);
    const abs = Math.abs(cents);
    if (abs < bestAbsCents) { bestAbsCents = abs; best = Object.assign({}, t, { cents }); }
  }
  return best;
}

/* ===========================================================
   BEND ENGINE  —  detectBend()

   A bend is a reed pulled FLAT of its natural pitch. It is only
   physically possible on the reeds listed in BEND_RANGES:
   draw 1-4 and 6, blow 8-10.

   Rules used here:
     1. If the pitch is sitting within 20 cents of ANY natural
        reed, it isn't a bend — it's just that note. Bail out.
     2. Otherwise look only at bendable reeds, measure how many
        cents FLAT the pitch is of each one, and keep candidates
        that are at least 40 cents flat but no more than the
        reed's full range (+30 cents of slack for reeds that
        over-pull slightly before choking).
     3. Of those, take the SHALLOWEST — i.e. the reed directly
        above the pitch is the one actually being bent, not some
        distant reed further up the harp.

   Returns the natural note, the bent note, exact cents of
   deviation, semitone depth, and a 0-1 progress value through
   the reed's full bend range for the visual gauge.
=========================================================== */
function detectBend(freq, table, targets) {
  if (!freq || freq <= 0) return null;

  const natural = nearestHarmonicaTarget(freq, targets);
  if (natural && Math.abs(natural.cents) <= 20) return null;

  let best = null;
  for (const row of table) {
    for (const action of ["draw", "blow"]) {
      const max = BEND_RANGES[action][row.hole];
      if (!max) continue;
      const reed = row[action];
      const centsFlat = -centsBetween(freq, reed.freq);   // positive = flat
      if (centsFlat < 40) continue;
      if (centsFlat > max * 100 + 30) continue;
      if (!best || centsFlat < best.centsFlat) {
        best = { hole: row.hole, action, reed, centsFlat, max };
      }
    }
  }
  if (!best) return null;

  const semitones = best.centsFlat / 100;
  const nearestStop = Math.max(1, Math.min(best.max, Math.round(semitones)));
  const chrom = nearestChromaticNote(freq);

  return {
    hole: best.hole,
    action: best.action,
    naturalNote: best.reed.note,
    naturalFreq: best.reed.freq,
    bentNote: chrom ? chrom.name + chrom.octave : "\u2014",
    centsFlat: best.centsFlat,
    semitones,
    maxSemitones: best.max,
    nearestStop,
    stepLabel: STEP_LABELS[nearestStop] || nearestStop / 2 + " steps",
    progress: Math.max(0, Math.min(1, semitones / best.max)),
    onStop: Math.abs(semitones - nearestStop) < 0.15,
  };
}

/* ===========================================================
   MONOPHONIC PITCH ENGINE — autocorrelation
=========================================================== */
function autocorrelate(buffer, sampleRate) {
  const SIZE = buffer.length;
  const NO_MATCH = { freq: -1, confidence: 0 };

  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.008) return NO_MATCH;

  let r1 = 0, r2 = SIZE - 1;
  const threshold = 0.2;
  for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buffer[i]) > threshold) { r1 = i; break; } }
  for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buffer[SIZE - i]) > threshold) { r2 = SIZE - i; break; } }
  const trimmed = buffer.slice(r1, r2);
  const n = trimmed.length;
  if (n < 512) return NO_MATCH;

  const c = new Array(n).fill(0);
  for (let lag = 0; lag < n; lag++) {
    let sum = 0;
    for (let i = 0; i < n - lag; i++) sum += trimmed[i] * trimmed[i + lag];
    c[lag] = sum;
  }

  let d = 0;
  while (d < n - 1 && c[d] > c[d + 1]) d++;

  let maxVal = -1, maxPos = -1;
  for (let i = d; i < n; i++) { if (c[i] > maxVal) { maxVal = c[i]; maxPos = i; } }
  if (maxPos <= 0) return NO_MATCH;

  const confidence = c[0] > 0 ? Math.max(0, Math.min(1, maxVal / c[0])) : 0;

  let T0 = maxPos;
  const x1 = c[T0 - 1] || c[T0];
  const x2 = c[T0];
  const x3 = c[T0 + 1] || c[T0];
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  if (a !== 0) T0 = T0 - b / (2 * a);

  const freq = sampleRate / T0;
  if (freq < 60 || freq > 3000) return NO_MATCH;
  return { freq, confidence };
}

/* ===========================================================
   POLYPHONIC / CHORD ENGINE

   Autocorrelation can only ever report ONE pitch, so chords need
   a separate path: an FFT, peak-picking on the spectrum, harmonic
   culling to reduce those peaks to plausible fundamentals, and
   then a match of each fundamental back onto the harp's reeds.
=========================================================== */
function findSpectralPeaks(freqData, sampleRate, fftSize) {
  const binHz = sampleRate / fftSize;
  const n = freqData.length;

  let maxDb = -Infinity;
  for (let i = 0; i < n; i++) if (freqData[i] > maxDb) maxDb = freqData[i];
  if (maxDb < -62) return [];                  // room tone / silence

  const floorDb = Math.max(-78, maxDb - 20);   // only peaks near the loudest
  const minBin = Math.max(2, Math.floor(150 / binHz));
  const maxBin = Math.min(n - 2, Math.ceil(2600 / binHz));

  const peaks = [];
  for (let i = minBin; i <= maxBin; i++) {
    const v = freqData[i];
    if (v < floorDb) continue;
    if (v <= freqData[i - 1] || v < freqData[i + 1]) continue;
    const a = freqData[i - 1], b = v, c = freqData[i + 1];
    const denom = a - 2 * b + c;
    const delta = denom !== 0 ? (0.5 * (a - c)) / denom : 0;
    peaks.push({ freq: (i + delta) * binHz, db: v });
  }
  peaks.sort((x, y) => y.db - x.db);
  return peaks.slice(0, 14);
}

function extractFundamentals(peaks) {
  const funds = [];
  for (const p of peaks) {
    let skip = false;
    for (const f of funds) {
      if (Math.abs(centsBetween(p.freq, f.freq)) < 45) { skip = true; break; }
      const ratio = p.freq / f.freq;
      const k = Math.round(ratio);
      if (k >= 2 && k <= 8 && Math.abs(ratio - k) < 0.035 * k) { skip = true; break; }
    }
    if (!skip) funds.push(p);
    if (funds.length >= 5) break;
  }
  return funds.sort((a, b) => a.freq - b.freq);
}

const CHORD_TEMPLATES = [
  { iv: [0, 4, 7],      name: "Major Triad" },
  { iv: [0, 3, 7],      name: "Minor Triad" },
  { iv: [0, 3, 6],      name: "Diminished Triad" },
  { iv: [0, 4, 8],      name: "Augmented Triad" },
  { iv: [0, 5, 7],      name: "Sus4" },
  { iv: [0, 2, 7],      name: "Sus2" },
  { iv: [0, 4, 7, 10],  name: "Dominant 7th" },
  { iv: [0, 4, 7, 11],  name: "Major 7th" },
  { iv: [0, 3, 7, 10],  name: "Minor 7th" },
  { iv: [0, 3, 6, 10],  name: "Half-Diminished 7th" },
  { iv: [0, 2, 4, 7],   name: "Major add9" },
  { iv: [0, 5, 7, 10],  name: "7sus4" },
  { iv: [0, 7],         name: "Perfect 5th" },
  { iv: [0, 5],         name: "Perfect 4th" },
  { iv: [0, 4],         name: "Major 3rd" },
  { iv: [0, 3],         name: "Minor 3rd" },
  { iv: [0, 2],         name: "Major 2nd" },
];

function nameChord(freqs) {
  const pcs = Array.from(new Set(freqs.map(f => {
    const m = Math.round(freqToMidi(f));
    return ((m % 12) + 12) % 12;
  }))).sort((a, b) => a - b);
  if (pcs.length < 2) return null;

  for (const root of pcs) {
    const iv = pcs.map(p => (((p - root) % 12) + 12) % 12).sort((a, b) => a - b);
    for (const t of CHORD_TEMPLATES) {
      if (t.iv.length === iv.length && t.iv.every((v, i) => v === iv[i])) {
        return NOTE_NAMES[root] + " " + t.name;
      }
    }
  }
  return pcs.map(p => NOTE_NAMES[p]).join(" + ") + " cluster";
}

/* Map each detected fundamental back onto the harp. A frequency
   can legitimately match two reeds (hole 2 draw and hole 3 blow
   are the same pitch on a C harp) — both get lit, which is the
   honest answer since the audio alone cannot distinguish them. */
function matchChordToHoles(fundamentals, targets) {
  // Pass 1: every reed within 40 cents of each fundamental.
  const cand = fundamentals.map(f => ({
    freq: f.freq,
    reeds: targets.filter(t => Math.abs(centsBetween(f.freq, t.freq)) <= 40),
  })).filter(c => c.reeds.length > 0);

  // Pass 2: unambiguous fundamentals vote on a breath direction,
  // then ambiguous ones (hole 2 draw and hole 3 blow are the same
  // pitch on a C harp) are resolved in favour of the majority.
  let blowVotes = 0, drawVotes = 0;
  for (const c of cand) {
    if (c.reeds.length === 1) {
      if (c.reeds[0].action === "blow") blowVotes++; else drawVotes++;
    }
  }
  const preferred = blowVotes === drawVotes ? null : (blowVotes > drawVotes ? "blow" : "draw");

  const holes = [];
  const seen = new Set();
  const notes = [];
  for (const c of cand) {
    let reeds = c.reeds;
    if (reeds.length > 1 && preferred) {
      const filtered = reeds.filter(r => r.action === preferred);
      if (filtered.length > 0) reeds = filtered;
    }
    for (const t of reeds) {
      const key = t.hole + "-" + t.action;
      if (!seen.has(key)) { seen.add(key); holes.push({ hole: t.hole, action: t.action, note: t.note }); }
    }
    notes.push(c.freq);
  }
  return { holes, notes };
}

/* ===========================================================
   SMOOTHING
=========================================================== */
function useStableFrequency(rawFreq, historyLen = 6) {
  const historyRef = useRef([]);
  const [stable, setStable] = useState(null);
  useEffect(() => {
    if (rawFreq == null) { historyRef.current = []; setStable(null); return; }
    const hist = historyRef.current;
    hist.push(rawFreq);
    if (hist.length > historyLen) hist.shift();
    const sorted = hist.slice().sort((a, b) => a - b);
    setStable(sorted[Math.floor(sorted.length / 2)]);
  }, [rawFreq]);
  return stable;
}

function useStableConfidence(rawConfidence, historyLen = 6) {
  const historyRef = useRef([]);
  const [stable, setStable] = useState(0);
  useEffect(() => {
    if (rawConfidence == null) { historyRef.current = []; setStable(0); return; }
    const hist = historyRef.current;
    hist.push(rawConfidence);
    if (hist.length > historyLen) hist.shift();
    setStable(hist.reduce((s, v) => s + v, 0) / hist.length);
  }, [rawConfidence]);
  return stable;
}

/* ===========================================================
   ENVIRONMENT DETECTION
=========================================================== */
function diagnoseEnvironment() {
  const inIframe = window.top !== window.self;
  const secure = typeof window.isSecureContext === "boolean" ? window.isSecureContext : location.protocol === "https:";
  const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const hasAudioContext = !!(window.AudioContext || window.webkitAudioContext);
  return { inIframe, secure, hasMediaDevices, hasAudioContext };
}

/* ===========================================================
   UI PIECES
=========================================================== */
/* Literal hex (not var()) so alpha suffixes can be concatenated
   onto them for borders and shadows. Keep in sync with :root. */
const ACTION_COLOR = {
  blow: { main: "#2BE06B", soft: "#8CFFBA", deep: "#0B4A26", ink: "#04220F" },
  draw: { main: "#37A8FF", soft: "#9ED6FF", deep: "#0A3558", ink: "#031B2E" },
};

function ActionBadge({ action, hole, bending }) {
  if (!action) {
    return (
      <div className="w-full rounded-2xl flex items-center justify-center py-7 brass-edge"
           style={{ background: "rgba(0,0,0,0.25)" }}>
        <span className="font-mono text-sm tracking-[0.3em] text-[var(--cream-dim)]/60">AWAITING A NOTE</span>
      </div>
    );
  }
  const c = ACTION_COLOR[action];
  const label = action.toUpperCase();
  return (
    <div key={action + "-" + hole} className="badge-pop w-full rounded-2xl flex items-center justify-between px-6 py-5"
      style={{

function TuningMeter({ cents }) {
  const clamped = cents == null ? 0 : Math.max(-50, Math.min(50, cents));
  const pct = 50 + (clamped / 50) * 50;
  const inTune = cents != null && Math.abs(cents) <= 6;
  const label = cents == null ? "\u2014" : (cents > 6 ? "SHARP" : cents < -6 ? "FLAT" : "IN TUNE");
  const labelColor = cents == null ? "text-[var(--cream-dim)]" : inTune ? "text-[var(--brass-bright)]" : "text-[var(--danger)]";
  return (
    <div className="w-full">
      <div className="flex items-center justify-between mb-1.5">
        <span className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)]">FLAT</span>
        <span className={"font-mono text-[11px] tracking-widest font-medium " + labelColor}>{label}</span>
        <span className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)]">SHARP</span>
      </div>
      <div className="relative h-2.5 rounded-full needle-track brass-edge overflow-visible">
        <div className="absolute top-1/2 w-0.5 h-5 rounded-full transition-all duration-150 ease-out"
          style={{
            left: pct + "%", transform: "translate(-50%, -50%)",
            background: inTune ? "var(--brass-bright)" : "var(--cream)",
            boxShadow: inTune ? "0 0 10px 2px rgba(232,196,104,0.8)" : "0 0 6px 1px rgba(242,232,213,0.5)",
          }} />
      </div>
      <div className="flex justify-between mt-1">
        <span className="font-mono text-[9px] text-[var(--cream-dim)]/60">-50&cent;</span>
        <span className="font-mono text-[9px] text-[var(--cream-dim)]/60">0&cent;</span>
        <span className="font-mono text-[9px] text-[var(--cream-dim)]/60">+50&cent;</span>
      </div>
    </div>
  );
}

   pulled flatter, with a tick at every semitone stop the reed
   can actually reach. */

  const active = !!bend;
  const pct = active ? bend.progress * 100 : 0;

  for (let s = 1; s <= max; s++) stops.push({ s, pos: (s / max) * 100 });

  return (
    <div className="grain-panel rounded-xl p-4"

                 boxShadow: active ? "0 0 18px 2px rgba(255,162,61,0.55)" : "none",
               }} />
          {stops.map(({ s, pos }) => (

              <span className="absolute -right-0.5 font-mono text-[8px] px-0.5"
                    style={{ color: "var(--cream)", background: "rgba(0,0,0,0.5)", transform: "translateY(-50%)" }}>

/* ===========================================================
   APP
=========================================================== */
function App() {
  const [listening, setListening] = useState(false);
  const [error, setError] = useState(null);
  const [rawFreq, setRawFreq] = useState(null);
  const [rawConfidence, setRawConfidence] = useState(0);
  const [permissionState, setPermissionState] = useState("idle");
  const [selectedKey, setSelectedKey] = useState("C");
  const [chord, setChord] = useState(null);

  const audioCtxRef = useRef(null);
  const analyserRef = useRef(null);       // time domain -> autocorrelation
  const fftRef = useRef(null);            // frequency domain -> chords
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const bufferRef = useRef(null);
  const fftBufferRef = useRef(null);
  const frameRef = useRef(0);
  const chordHoldRef = useRef({ value: null, t: 0 });
  const keyRef = useRef("C");

  useEffect(() => { keyRef.current = selectedKey; }, [selectedKey]);

  const table = HARMONICA_TABLES[selectedKey];
  const targets = useMemo(() => flattenTargets(table), [table]);

  const stableFreq = useStableFrequency(rawFreq);
  const stableConfidence = useStableConfidence(rawConfidence);

  const chromatic = useMemo(() => nearestChromaticNote(stableFreq), [stableFreq]);
  const match = useMemo(() => nearestHarmonicaTarget(stableFreq, targets), [stableFreq, targets]);
  const bend = useMemo(() => {
    if (stableFreq == null || stableConfidence < 0.70) return null;
    return detectBend(stableFreq, table, targets);
  }, [stableFreq, stableConfidence, table, targets]);

  const isChord = !!(chord && chord.holes && chord.holes.length >= 2);
  const isLocked = !isChord && !bend && match && Math.abs(match.cents) <= 45 && stableFreq != null && stableConfidence >= 0.85;

  /* Which reeds light up, and how. Chord wins over bend, bend
     wins over a plain single note. */
  const activeMap = useMemo(() => {
    const m = {};
    if (isChord) {
      for (const h of chord.holes) m["" + h.hole + "-" + h.action] = { bend: false };
      return m;
    }
    if (bend) { m["" + bend.hole + "-" + bend.action] = { bend: true }; return m; }
    if (isLocked) { m["" + match.hole + "-" + match.action] = { bend: false }; }
    return m;
  }, [isChord, chord, bend, isLocked, match]);

  const displayAction = isChord ? null : bend ? bend.action : isLocked ? match.action : null;
  const displayHole = isChord ? null : bend ? bend.hole : isLocked ? match.hole : null;

  const tick = useCallback(() => {
    const analyser = analyserRef.current;
    const buffer = bufferRef.current;
    const ctx = audioCtxRef.current;

    if (analyser && buffer && ctx) {
      analyser.getFloatTimeDomainData(buffer);
      const res = autocorrelate(buffer, ctx.sampleRate);
      setRawFreq(res.freq > 0 ? res.freq : null);
      setRawConfidence(res.freq > 0 ? res.confidence : 0);

      // Chord pass is ~5x cheaper to run at 1/5 the rate, and the
      // ear can't tell the difference at ~12 updates/sec.
      frameRef.current = (frameRef.current + 1) % 5;
      if (frameRef.current === 0 && fftRef.current && fftBufferRef.current) {
        const fft = fftRef.current;
        fft.getFloatFrequencyData(fftBufferRef.current);
        const peaks = findSpectralPeaks(fftBufferRef.current, ctx.sampleRate, fft.fftSize);
        const funds = extractFundamentals(peaks);
        const tgts = flattenTargets(HARMONICA_TABLES[keyRef.current]);
        const matched = matchChordToHoles(funds, tgts);

        const now = performance.now();
        if (matched.holes.length >= 2 && matched.notes.length >= 2) {
          const next = { holes: matched.holes, name: nameChord(matched.notes) };
          chordHoldRef.current = { value: next, t: now };
          setChord(next);
        } else if (now - chordHoldRef.current.t > 450) {
          // short hold so a chord doesn't strobe on the frames
          // where one reed momentarily dips below the peak floor
          if (chordHoldRef.current.value !== null) {
            chordHoldRef.current = { value: null, t: now };
            setChord(null);
          }
        }
      }
    }
    rafRef.current = requestAnimationFrame(tick);
  }, []);

  const start = async () => {
    setError(null);
    const diag = diagnoseEnvironment();

    if (diag.inIframe) {
      setError("This page is running inside another site's iframe (for example, an embedded preview). Cross-origin iframes are not granted microphone access unless the embedding page explicitly allows it, and this one doesn't. Open this app directly \u2014 as its own tab at its own https:// address \u2014 and try again.");
      return;
    }
    if (!diag.secure) { setError("Microphone access requires a secure context (HTTPS)."); return; }
    if (!diag.hasMediaDevices) { setError("This browser does not expose navigator.mediaDevices.getUserMedia."); return; }
    if (!diag.hasAudioContext) { setError("This browser does not expose the Web Audio API (AudioContext)."); return; }

    setPermissionState("requesting");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      streamRef.current = stream;

      const AudioContextCls = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContextCls();
      audioCtxRef.current = audioCtx;
      if (audioCtx.state === "suspended") await audioCtx.resume();

      const source = audioCtx.createMediaStreamSource(stream);

      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      analyserRef.current = analyser;
      bufferRef.current = new Float32Array(analyser.fftSize);

      // Separate, larger FFT for chord work: 8192 bins gives ~5.4 Hz
      // resolution, enough to separate adjacent harmonica reeds.
      const fft = audioCtx.createAnalyser();
      fft.fftSize = 8192;
      fft.smoothingTimeConstant = 0.4;
      fft.minDecibels = -95;
      fft.maxDecibels = -10;
      source.connect(fft);
      fftRef.current = fft;
      fftBufferRef.current = new Float32Array(fft.frequencyBinCount);

      setPermissionState("granted");
      setListening(true);
      rafRef.current = requestAnimationFrame(tick);
    } catch (err) {
      setPermissionState("idle");
      const name = err && err.name ? err.name : "Error";
      const message = err && err.message ? err.message : String(err);
      let hint = "";
      if (name === "NotAllowedError") hint = " Either the prompt was denied, or this context isn't allowed to request the mic. On iOS check Settings \u203A Safari \u203A Microphone.";
      else if (name === "NotFoundError") hint = " No microphone was found on this device.";
      setError(name + ": " + message + hint);
    }
  };

  const stop = () => {
    setListening(false);
    setPermissionState("idle");
    setRawFreq(null);
    setRawConfidence(0);
    setChord(null);
    chordHoldRef.current = { value: null, t: 0 };
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    if (audioCtxRef.current) { audioCtxRef.current.close().catch(() => {}); audioCtxRef.current = null; }
    analyserRef.current = null;
    fftRef.current = null;
    bufferRef.current = null;
    fftBufferRef.current = null;
  };

  useEffect(() => () => stop(), []);

  const displayNote = stableFreq != null && chromatic ? chromatic.name + chromatic.octave : "\u2014";
  const displayFreq = stableFreq != null ? stableFreq.toFixed(1) : "\u2014";
  const meterCents = bend ? null : (stableFreq != null && match ? match.cents : (stableFreq != null && chromatic ? chromatic.cents : null));

  return (
    <div className="min-h-screen flex flex-col items-center px-4 py-8 sm:py-12">
      <div className="w-full max-w-2xl text-center mb-7 rise-in">
        <div className="font-mono text-[11px] tracking-[0.35em] text-[var(--brass)] mb-2">HOLE &middot; BREATH &middot; BEND &middot; CHORD</div>
        <h1 className="font-display text-4xl sm:text-5xl font-semibold text-[var(--cream)] leading-tight">Harmonica Tuner</h1>
        <p className="text-[var(--cream-dim)] mt-2 text-sm sm:text-base max-w-md mx-auto">
          Play into the microphone. Green means blow, blue means draw, amber means you're bending.
        </p>
      </div>

      <div className="w-full max-w-2xl flex flex-col gap-5">

        <div className="grain-panel brass-edge rounded-xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4 rise-in" style={{ animationDelay: "60ms" }}>
          <div className="flex items-center gap-4">
            <div className="flex items-center gap-3">
              <div className="w-3 h-3 rounded-full flex-shrink-0"
                style={{ background: listening ? "var(--blow)" : "var(--brass-dim)", boxShadow: listening ? "0 0 10px 2px rgba(43,224,107,0.7)" : "none" }} />
              <span className="font-mono text-xs tracking-widest text-[var(--cream-dim)]">{listening ? "LISTENING" : "MICROPHONE OFF"}</span>
            </div>
            <KeySelector selectedKey={selectedKey} onChange={setSelectedKey} />
          </div>
          <button onClick={listening ? stop : start} disabled={permissionState === "requesting"}
            className="font-mono font-bold text-sm tracking-widest px-6 py-3.5 rounded-lg transition-transform active:scale-[0.97] disabled:opacity-60 w-full sm:w-auto"
            style={{
              background: listening ? "var(--danger)" : "linear-gradient(180deg, var(--brass-bright), var(--brass))",
              color: listening ? "#2A130D" : "#221805", border: "none",
              boxShadow: listening ? "0 4px 14px -4px rgba(200,84,60,0.6)" : "0 4px 14px -4px rgba(200,155,60,0.6)",
            }}>
            {permissionState === "requesting" ? "REQUESTING ACCESS\u2026" : listening ? "\u25A0 STOP LISTENING" : "\u25B6 START LISTENING"}
          </button>
        </div>

        {error && (
          <div className="rounded-xl p-4 text-sm rise-in" style={{ background: "rgba(200,84,60,0.12)", border: "1px solid rgba(200,84,60,0.4)", color: "#F0BBAE" }}>
            <div className="font-mono text-[10px] tracking-widest mb-1.5" style={{ color: "var(--danger)" }}>MICROPHONE ERROR</div>
            <div className="font-mono text-xs leading-relaxed break-words">{error}</div>
          </div>
        )}

        {/* BIG BLOW / DRAW READOUT */}
        <div className="rise-in" style={{ animationDelay: "100ms" }}>
          <ActionBadge action={displayAction} hole={displayHole} bending={!!bend} />
        </div>

        <div className="grain-panel brass-edge rounded-xl p-5 sm:p-6 rise-in" style={{ animationDelay: "140ms" }}>
          <div className="grid grid-cols-2 gap-6 mb-5">
            <div>
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">FREQUENCY</div>
              <div className="font-mono text-3xl sm:text-4xl font-medium text-[var(--cream)] tabular-nums">{displayFreq}<span className="text-base text-[var(--cream-dim)] ml-1">Hz</span></div>
            </div>
            <div className="text-right">
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">NOTE</div>
              <div className="font-display text-3xl sm:text-4xl font-medium text-[var(--brass-bright)]">{displayNote}</div>
            </div>
          </div>

          <TuningMeter cents={meterCents} />

          <div className="mt-4 grid grid-cols-2 gap-4">
            <div>
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">CENTS</div>
              <div className="font-mono text-lg tabular-nums"
                   style={{ color: meterCents == null ? "var(--cream-dim)" : Math.abs(meterCents) <= 6 ? "var(--brass-bright)" : "var(--danger)" }}>
                {meterCents == null ? (bend ? "bending" : "\u2014") : (meterCents > 0 ? "+" : "") + meterCents.toFixed(1) + "\u00A2"}
              </div>
            </div>
            <div className="text-right">
              <div className="font-mono text-[10px] tracking-widest text-[var(--cream-dim)] mb-1">CONFIDENCE</div>
              <div className="font-mono text-lg tabular-nums text-[var(--cream)]">{listening ? Math.round(stableConfidence * 100) + "%" : "\u2014"}</div>
            </div>
          </div>
        </div>

        <div className="rise-in" style={{ animationDelay: "180ms" }}>
          <BendMeter bend={bend} />
        </div>

        <div className="rise-in" style={{ animationDelay: "210ms" }}>
          <ChordPanel chord={chord} />
        </div>

        <div className="rise-in" style={{ animationDelay: "240ms" }}>
          <HarmonicaBody table={table} tableKey={selectedKey} activeMap={activeMap} />
        </div>

        <div className="rise-in" style={{ animationDelay: "280ms" }}>
          <ReferenceChart table={table} activeMap={activeMap} />
        </div>

        <p className="text-center text-[var(--cream-dim)]/60 text-xs pb-4">
          Best in a quiet room with the harp close to the mic. Bends register past 40&cent; flat; chords need two or more reeds sounding together.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
